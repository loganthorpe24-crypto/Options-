[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qqq0dte"
version = "0.1.0"
description = "QQQ 0DTE options strategy (from @nickafischer's Nov 20, 2026 reel): Alpaca backtester + paper runner. Educational, not financial advice."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pandas>=2.0", "numpy>=1.24", "PyYAML>=6.0", "tzdata>=2023.3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
qqq0dte = "qqq0dte.cli:main"

[tool.setuptools]
packages = ["qqq0dte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
